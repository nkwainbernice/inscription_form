<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signin page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="./signup.html">SIGNUP</a></li>
            <li><a href="./signin.html">SIGNIN</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>

        <!-- Error/Success Message Display -->
        <div id="messageBox" style="display:none; margin: 15px 0; padding: 10px; border-radius: 4px; text-align: center;"></div>

        <form action="connect.php" method="POST">

            <!-- VERY IMPORTANT -->
            <input type="hidden" name="action" value="login">

            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="btn">
                <button type="reset" class="cancel">cancel</button>
                <button type="submit" class="submit">signin</button>
            </div>

        </form>

    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const signup = params.get('signup');
        const messageBox = document.getElementById('messageBox');
        
        if (error) {
            messageBox.textContent = '❌ ' + decodeURIComponent(error);
            messageBox.style.color = 'red';
            messageBox.style.backgroundColor = '#ffe6e6';
            messageBox.style.display = 'block';
            window.history.replaceState({}, document.title, './signin.html');
        } else if (signup === 'success') {
            messageBox.textContent = '✔ Account created successfully! Please sign in.';
            messageBox.style.color = 'green';
            messageBox.style.backgroundColor = '#e6ffe6';
            messageBox.style.display = 'block';
            window.history.replaceState({}, document.title, './signin.html');
        }
    });
</script>

</body>
</html>
